name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Validate release contracts
        run: npm run test:release-contract

  rust:
    name: Rust check
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            unzip \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libxkbcommon-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: ci-linux
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  native-package-smoke:
    name: Native package smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            rustTarget: x86_64-pc-windows-msvc
            smokeBundle: nsis
            expectedPattern: '*.exe'
          - os: ubuntu-22.04
            platform: linux-x86_64
            rustTarget: x86_64-unknown-linux-gnu
            smokeBundle: deb
            expectedPattern: '*.deb'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.rustTarget }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: package-${{ matrix.platform }}
      - name: Install Linux desktop dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            unzip \
            libsecret-1-dev \
            libxdo-dev \
            libxkbcommon-dev
      - name: Install dependencies
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund
      - name: Stage pinned rclone resource
        run: npm run sidecar:prepare:release
      - name: Verify staged rclone
        run: npm run sidecar:verify:release
      - name: Generate platform icons
        run: npm run icons:prepare
      - name: Generate package config
        run: node .github/scripts/create-package-build-config.mjs src-tauri/tauri.package.conf.json
      - name: Check release-mode native runtime
        run: cargo check --locked --release --manifest-path src-tauri/Cargo.toml --target "${{ matrix.rustTarget }}"
      - name: Build representative package
        run: npm run tauri -- build --target "${{ matrix.rustTarget }}" --bundles "${{ matrix.smokeBundle }}" --config src-tauri/tauri.package.conf.json
      - name: Verify package output
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find src-tauri/target -type f -name '${{ matrix.expectedPattern }}' -print -quit)"
