name: Remote MCP relay bootstrap final

on:
  push:
    branches:
      - feat/remote-mcp-desktop-relay

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remote-mcp-desktop-relay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply deterministic relay wiring
        run: |
          python3 <<'PY'
          from pathlib import Path

          auth = Path('src-tauri/src/atris_auth.rs')
          text = auth.read_text()
          if 'use chrono::{DateTime, Duration as ChronoDuration, Utc};' not in text:
              text = text.replace('use reqwest::{\n', 'use chrono::{DateTime, Duration as ChronoDuration, Utc};\nuse reqwest::{\n', 1)
          if 'RELAY_REFRESH_MARGIN_SECONDS' not in text:
              text = text.replace(
                  'const REQUEST_TIMEOUT_SECONDS: u64 = 20;\n',
                  'const REQUEST_TIMEOUT_SECONDS: u64 = 20;\nconst RELAY_REFRESH_MARGIN_SECONDS: i64 = 120;\n',
                  1,
              )

          runtime_start = text.index('#[derive(Default)]\nstruct AuthRuntime {')
          runtime_end = text.index('\n}\n', runtime_start) + 3
          runtime = '''#[derive(Default)]
struct AuthRuntime {
    access_token: Option<String>,
    access_token_expires_at: Option<DateTime<Utc>>,
    volatile_refresh_token: Option<String>,
    snapshot: Option<AuthSnapshot>,
}

#[derive(Debug, Clone)]
pub(crate) struct DesktopRelayCredential {
    pub(crate) user_id: String,
    pub(crate) device_id: String,
    pub(crate) access_token: String,
}
'''
          text = text[:runtime_start] + runtime + text[runtime_end:]

          relay_auth = '''fn commit_session(
    app: &AppHandle,
    state: &AtrisHubAuthState,
    response: DesktopSessionResponse,
    remember: bool,
) -> Result<AuthSnapshot, String> {
    let access_token_expires_at = DateTime::parse_from_rfc3339(&response.access_token_expires_at)
        .map(|value| value.with_timezone(&Utc))
        .map_err(|_| "AtrisHub returned an invalid desktop access-token expiry.".to_string())?;
    if access_token_expires_at <= Utc::now() {
        return Err("AtrisHub returned an already expired desktop access token.".into());
    }
    if remember {
        if let Err(error) = secure_store::store_atrishub_refresh_token(&response.refresh_token) {
            send_logout(&response.refresh_token);
            return Err(error);
        }
    } else {
        secure_store::delete_atrishub_refresh_token()?;
    }
    let snapshot = AuthSnapshot::signed_in(&response, remember);
    cache_snapshot(app, &snapshot)?;
    let mut runtime = state
        .inner
        .lock()
        .map_err(|_| "AtrisHub authentication state is unavailable.".to_string())?;
    runtime.access_token = Some(response.access_token);
    runtime.access_token_expires_at = Some(access_token_expires_at);
    runtime.volatile_refresh_token = (!remember).then_some(response.refresh_token);
    runtime.snapshot = Some(snapshot.clone());
    Ok(snapshot)
}

fn current_desktop_relay_credential(
    app: &AppHandle,
    state: &AtrisHubAuthState,
) -> Result<Option<DesktopRelayCredential>, String> {
    let runtime = state
        .inner
        .lock()
        .map_err(|_| "AtrisHub authentication state is unavailable.".to_string())?;
    let Some(snapshot) = runtime.snapshot.as_ref() else {
        return Ok(None);
    };
    let Some(user) = snapshot.user.as_ref() else {
        return Ok(None);
    };
    let Some(access_token) = runtime.access_token.as_ref() else {
        return Ok(None);
    };
    let Some(expires_at) = runtime.access_token_expires_at.as_ref() else {
        return Ok(None);
    };
    if *expires_at <= Utc::now() + ChronoDuration::seconds(RELAY_REFRESH_MARGIN_SECONDS) {
        return Ok(None);
    }
    let user_id = user.id.clone();
    let access_token = access_token.clone();
    drop(runtime);
    Ok(Some(DesktopRelayCredential {
        user_id,
        device_id: get_or_create_device_id(app)?,
        access_token,
    }))
}

pub(crate) fn desktop_relay_credential(
    app: &AppHandle,
    state: &AtrisHubAuthState,
) -> Result<Option<DesktopRelayCredential>, String> {
    if let Some(current) = current_desktop_relay_credential(app, state)? {
        return Ok(Some(current));
    }

    let _refresh_operation = AUTH_REFRESH_LOCK
        .lock()
        .map_err(|_| "AtrisHub refresh operation lock is unavailable.".to_string())?;
    if let Some(current) = current_desktop_relay_credential(app, state)? {
        return Ok(Some(current));
    }

    let remembered = secure_store::load_atrishub_refresh_token()?;
    let volatile = state
        .inner
        .lock()
        .map_err(|_| "AtrisHub authentication state is unavailable.".to_string())?
        .volatile_refresh_token
        .clone();
    let remember = remembered.is_some();
    let Some(refresh_token) = remembered.as_deref().or(volatile.as_deref()) else {
        return Ok(None);
    };

    match send_refresh(refresh_token) {
        Ok(response) => {
            commit_session(app, state, response, remember)?;
            current_desktop_relay_credential(app, state)
        }
        Err(failure) if matches!(failure.kind, FailureKind::Network | FailureKind::Server) => {
            Err(failure.message)
        }
        Err(failure) => {
            clear_local_identity(app)?;
            let mut runtime = state
                .inner
                .lock()
                .map_err(|_| "AtrisHub authentication state is unavailable.".to_string())?;
            *runtime = AuthRuntime::default();
            Err(failure.message)
        }
    }
}
'''
          commit_start = text.index('fn commit_session(')
          commit_end = text.index('\nfn set_runtime_snapshot(', commit_start)
          text = text[:commit_start] + relay_auth + text[commit_end + 1:]
          auth.write_text(text)

          ipc = Path('src-tauri/src/local_mcp_ipc.rs')
          text = ipc.read_text()
          private = 'fn redact_local_paths(app: &AppHandle, message: &str) -> String {'
          if private in text:
              text = text.replace(private, 'pub(crate) fn redact_local_paths(app: &AppHandle, message: &str) -> String {', 1)
          ipc.write_text(text)

          lib = Path('src-tauri/src/lib.rs')
          text = lib.read_text()
          if 'mod remote_mcp_relay;' not in text:
              text = text.replace('mod restore;\n', 'mod remote_mcp_relay;\nmod restore;\n', 1)
          if 'remote_mcp_relay::setup(app.handle());' not in text:
              start = text.index('if let Err(error) = local_mcp_ipc::setup(app.handle()) {')
              ok = text.index('            Ok(())', start)
              text = text[:ok] + '            remote_mcp_relay::setup(app.handle());\n' + text[ok:]
          lib.write_text(text)

          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text().rstrip() + '\n'
          dependencies = [
              ('futures-util', 'futures-util = "0.3.31"'),
              ('sha2', 'sha2 = "0.10.9"'),
              ('tokio', 'tokio = { version = "1", features = ["net", "sync", "time"] }'),
              ('tokio-tungstenite', 'tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }'),
          ]
          for key, line in dependencies:
              if not any(existing.strip().startswith(key + ' =') for existing in text.splitlines()):
                  text += line + '\n'
          cargo.write_text(text)

          relay = Path('src-tauri/src/remote_mcp_relay.rs')
          text = relay.read_text()
          text = text.replace(
              'mcp.remote.87daa3985036671953760490bb3d0b1c',
              'mcp.remote.b44ea687b506d5ca725c434cbe69d0cd',
          )
          if 'let worker_request_id = request.request_id.clone();' not in text:
              marker = '                        let worker_tx = outgoing_tx.clone();\n'
              pos = text.index(marker) + len(marker)
              text = text[:pos] + (
                  '                        let worker_request_id = request.request_id.clone();\n'
                  '                        let worker_reply_to = request.reply_to.clone();\n'
              ) + text[pos:]
          panic_start = text.index('                            let value = match response {')
          panic_end = text.index('                            let _ = send_json(&worker_tx, value).await;', panic_start)
          replacement = '''                            let value = match response {
                                Ok(value) => value,
                                Err(error) => relay_error_response_parts(
                                    &worker_request_id,
                                    &worker_reply_to,
                                    "desktop_worker_failed",
                                    &format!("Remote MCP worker failed: {error}"),
                                ),
                            };
'''
          text = text[:panic_start] + replacement + text[panic_end:]
          relay.write_text(text)
          PY
      - name: Resolve, format, and verify Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all
          cargo check --lib
          cargo test --lib
      - name: Remove all bootstrap workflows and commit product tree
        run: |
          rm -f \
            .github/workflows/remote-mcp-relay-bootstrap.yml \
            .github/workflows/remote-mcp-relay-bootstrap-fix.yml \
            .github/workflows/remote-mcp-relay-bootstrap-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire authenticated remote MCP desktop relay"
          git push origin HEAD:feat/remote-mcp-desktop-relay
