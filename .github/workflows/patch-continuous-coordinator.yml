name: Temporary continuous coordinator patch

on:
  push:
    branches: [feat/continuous-coordinator-serialization]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/continuous-coordinator-serialization
          persist-credentials: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply coordinator serialization patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          continuous_path = Path("src-tauri/src/continuous.rs")
          text = continuous_path.read_text()

          text = replace_once(
              text,
              "    sync,\n    transport::rclone,\n};",
              "    sync,\n    transport::rclone,\n    workspace_coordinator::{\n        WorkspaceLeaseError, WorkspaceMutationCoordinator, WorkspaceOperationKind,\n    },\n};",
              "continuous imports",
          )
          text = replace_once(
              text,
              "const MAX_FAILURE_BACKOFF_MULTIPLIER: u64 = 8;",
              "const MAX_FAILURE_BACKOFF_MULTIPLIER: u64 = 8;\nconst COORDINATOR_RETRY_DELAY: Duration = Duration::from_secs(1);",
              "retry constant",
          )
          text = replace_once(
              text,
              "#[derive(Debug, Clone)]\nstruct PendingCycle {\n    due: Instant,\n    reason: String,\n}\n",
              "#[derive(Debug, Clone)]\nstruct PendingCycle {\n    due: Instant,\n    reason: String,\n}\n\n#[derive(Debug, Clone)]\nstruct CycleRetry {\n    reason: String,\n    delay: Duration,\n}\n",
              "cycle retry type",
          )
          text = replace_once(
              text,
              "    Finished {\n        workspace_id: String,\n    },",
              "    Finished {\n        workspace_id: String,\n        retry: Option<CycleRetry>,\n    },",
              "finished message",
          )
          text = replace_once(
              text,
              "    manager: State<'_, ContinuousSyncManager>,\n    sessions: State<'_, ProviderSessionStore>,\n) -> Result<ContinuousSyncStatus, String> {\n    let workspace = find_workspace(&app, &id)?;",
              "    manager: State<'_, ContinuousSyncManager>,\n    sessions: State<'_, ProviderSessionStore>,\n    coordinator: State<'_, WorkspaceMutationCoordinator>,\n) -> Result<ContinuousSyncStatus, String> {\n    let _lease = coordinator\n        .acquire(&id, \"desktop-watch-control\", WorkspaceOperationKind::Configure)\n        .map_err(|error| error.to_string())?;\n    let workspace = find_workspace(&app, &id)?;",
              "watch enable coordinator",
          )
          text = replace_once(
              text,
              "    remote_poll_seconds: u64,\n    manager: State<'_, ContinuousSyncManager>,\n) -> Result<ContinuousSyncStatus, String> {\n    find_workspace(&app, &id)?;",
              "    remote_poll_seconds: u64,\n    manager: State<'_, ContinuousSyncManager>,\n    coordinator: State<'_, WorkspaceMutationCoordinator>,\n) -> Result<ContinuousSyncStatus, String> {\n    let _lease = coordinator\n        .acquire(&id, \"desktop-watch-control\", WorkspaceOperationKind::Configure)\n        .map_err(|error| error.to_string())?;\n    find_workspace(&app, &id)?;",
              "watch settings coordinator",
          )
          text = replace_once(
              text,
              "                SchedulerMessage::Finished { workspace_id } => {\n                    in_flight.remove(&workspace_id);\n                }",
              "                SchedulerMessage::Finished {\n                    workspace_id,\n                    retry,\n                } => {\n                    in_flight.remove(&workspace_id);\n                    if let Some(retry) = retry {\n                        if matches!(is_enabled(&app, &workspace_id), Ok(true)) {\n                            let due = Instant::now() + retry.delay;\n                            pending\n                                .entry(workspace_id)\n                                .and_modify(|entry| {\n                                    if due > entry.due {\n                                        entry.due = due;\n                                    }\n                                })\n                                .or_insert(PendingCycle {\n                                    due,\n                                    reason: retry.reason,\n                                });\n                        }\n                    }\n                }",
              "finished retry scheduling",
          )
          text = replace_once(
              text,
              "            tauri::async_runtime::spawn(async move {\n                run_cycle(cycle_app, workspace_id.clone(), reason).await;\n                let _ = completion_sender.send(SchedulerMessage::Finished { workspace_id });\n            });",
              "            tauri::async_runtime::spawn(async move {\n                let retry = run_cycle(cycle_app, workspace_id.clone(), reason).await;\n                let _ = completion_sender.send(SchedulerMessage::Finished {\n                    workspace_id,\n                    retry,\n                });\n            });",
              "cycle completion retry",
          )
          text = replace_once(
              text,
              "async fn run_cycle(app: AppHandle, workspace_id: String, reason: String) {\n    let previous = match ensure_settings_row(&app, &workspace_id) {\n        Ok(settings) => settings,\n        Err(_) => return,\n    };\n    if let Err(error) = mark_cycle_running(&app, &workspace_id, &reason) {\n        let _ = record_cycle_error(&app, &workspace_id, &reason, &error);\n        return;\n    }",
              "async fn run_cycle(\n    app: AppHandle,\n    workspace_id: String,\n    reason: String,\n) -> Option<CycleRetry> {\n    let previous = match ensure_settings_row(&app, &workspace_id) {\n        Ok(settings) => settings,\n        Err(_) => return None,\n    };\n\n    let coordinator = app.state::<WorkspaceMutationCoordinator>();\n    let _lease = match coordinator.acquire(\n        &workspace_id,\n        \"continuous-watch\",\n        WorkspaceOperationKind::Continuous,\n    ) {\n        Ok(lease) => lease,\n        Err(WorkspaceLeaseError::Busy(active)) => {\n            let message = format!(\n                \"Workspace is busy with '{}' owned by '{}'. Continuous reconciliation is queued and will retry automatically.\",\n                active.kind, active.owner\n            );\n            let _ = record_cycle_deferred(&app, &workspace_id, &reason, &message);\n            return Some(CycleRetry {\n                reason,\n                delay: COORDINATOR_RETRY_DELAY,\n            });\n        }\n        Err(error) => {\n            let _ = record_cycle_error(&app, &workspace_id, &reason, &error.to_string());\n            return None;\n        }\n    };\n\n    if let Err(error) = mark_cycle_running(&app, &workspace_id, &reason) {\n        let _ = record_cycle_error(&app, &workspace_id, &reason, &error);\n        return None;\n    }",
              "cycle lease acquisition",
          )
          text = replace_once(
              text,
              "        Err(error) => {\n            let _ = record_cycle_error(&app, &workspace_id, &reason, &error);\n        }\n    }\n}\n\nstruct CycleOutcome {",
              "        Err(error) => {\n            let _ = record_cycle_error(&app, &workspace_id, &reason, &error);\n        }\n    }\n    None\n}\n\nstruct CycleOutcome {",
              "cycle completion return",
          )
          text = replace_once(
              text,
              "fn record_cycle_outcome(\n    app: &AppHandle,",
              "fn record_cycle_deferred(\n    app: &AppHandle,\n    workspace_id: &str,\n    reason: &str,\n    message: &str,\n) -> Result<(), String> {\n    let connection = open_continuous_database(app)?;\n    connection\n        .execute(\n            \"UPDATE continuous_sync_settings\n             SET state = 'debouncing',\n                 last_reason = ?1,\n                 last_message = ?2,\n                 last_decision = 'deferred',\n                 updated_at = ?3\n             WHERE workspace_id = ?4 AND enabled = 1\",\n            params![\n                reason,\n                truncate_message(message),\n                Utc::now().to_rfc3339(),\n                workspace_id\n            ],\n        )\n        .map_err(|error| format!(\"Could not record deferred continuous cycle: {error}\"))?;\n    Ok(())\n}\n\nfn record_cycle_outcome(\n    app: &AppHandle,",
              "deferred journal helper",
          )
          continuous_path.write_text(text)

          commands_path = Path("src-tauri/src/continuous_commands.rs")
          commands = commands_path.read_text()
          commands = replace_once(
              commands,
              "    commands, continuous,\n    continuous::ContinuousSyncManager,",
              "    commands,\n    continuous::ContinuousSyncManager,",
              "remove continuous module import",
          )
          commands = replace_once(
              commands,
              "fn acquire_manual(\n    app: &AppHandle,\n    workspace_id: &str,\n    coordinator: &WorkspaceMutationCoordinator,\n    kind: WorkspaceOperationKind,\n) -> Result<WorkspaceMutationLease, String> {\n    ensure_manual_control_allowed(app, workspace_id)?;\n    coordinator\n        .acquire(workspace_id, \"desktop-manual\", kind)\n        .map_err(|error| error.to_string())\n}\n\nfn ensure_manual_control_allowed(app: &AppHandle, workspace_id: &str) -> Result<(), String> {\n    if continuous::is_enabled(app, workspace_id)? {\n        return Err(\n            \"Continuous watch mode currently owns this workspace. Pause watch mode before scanning manually, changing bindings/sync mode/encryption setup, importing recovery keys, restoring recovery files, or running a manual plan.\"\n                .into(),\n        );\n    }\n    Ok(())\n}\n",
              "fn acquire_manual(\n    _app: &AppHandle,\n    workspace_id: &str,\n    coordinator: &WorkspaceMutationCoordinator,\n    kind: WorkspaceOperationKind,\n) -> Result<WorkspaceMutationLease, String> {\n    coordinator\n        .acquire(workspace_id, \"desktop-manual\", kind)\n        .map_err(|error| error.to_string())\n}\n",
              "manual watch gate removal",
          )
          commands_path.write_text(commands)

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/continuous.rs src-tauri/src/continuous_commands.rs
          git diff --cached --check
          git commit -m "Serialize continuous sync with workspace coordinator"
          git push origin HEAD:feat/continuous-coordinator-serialization
