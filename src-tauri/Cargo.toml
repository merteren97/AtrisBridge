[package]
name = "atrisbridge"
version = "0.1.0-alpha.9"
description = "Local-first project synchronization for developers and engineering teams."
authors = ["AtrisHub"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "atris_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
blake3 = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
keyring = "4.1.6"
notify = "8.2.0"
chacha20poly1305 = "0.11.0"
futures-util = "0.3.31"
sha2 = "0.10.9"
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }