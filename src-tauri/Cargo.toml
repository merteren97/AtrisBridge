[package]
name = "atrisbridge"
version = "0.1.0-alpha.1"
description = "Local-first project synchronization for developers and engineering teams."
authors = ["AtrisHub"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "atris_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
blake3 = "1"
